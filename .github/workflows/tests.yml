name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests Node et soumissions disponibles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build test image
        run: docker compose build p27-tests
      - name: Run project tests
        run: docker compose run --rm p27-tests npm test
      - name: Test available Cursor submissions
        run: docker compose run --rm -e P27_TOOL=cursor p27-tests npm run test:all -- --allow-missing
      - name: Test available Copilot submissions
        run: docker compose run --rm -e P27_TOOL=copilot p27-tests npm run test:all -- --allow-missing
      - name: Test available Cline submissions
        run: docker compose run --rm -e P27_TOOL=cline-qwen2.5-coder-7b p27-tests npm run test:all -- --allow-missing
